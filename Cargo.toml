[package]
name = "deepfilter-vst"
version = "0.1.0"
edition = "2021"
authors = ["vaisest <your@email.com>"]
license = "GPL-3.0-or-later"
homepage = ""
description = "A short description of your plugin"

[workspace]
members = ["xtask"]

[[bin]]
name = "vst_standalone"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
audio_thread_priority = { version = "0.38.0", default-features = false }
audioadapter = "2.0.0"
audioadapter-buffers = "2.0.0"
# fork due to dependency version issues
deep_filter = { git = "https://github.com/vaisest/DeepFilterNet.git", default-features = false, features = [
    "tract",
    # there are two models available. The regular one and an "LL" (presumably
    # low latency) version which does not have lookahead, but has less latency
    # The LL version would seem like a smart choice to use here, but it seems to
    # be about twice as slow

    # TODO: add as feature
    "default-model",
] }
egui = { version = "0.37.0", features = ["default_fonts"] }
ndarray = "^0.17"
# Remove the `assert_process_allocs` feature to allow allocations on the audio
# thread in debug builds.
nice-plug = { version = "0.4.2", features = [
    "assert_process_allocs",
    "standalone",
] }
nice-plug-egui = "0.6.0"
rtrb = "^0.3.0"
rubato = "^1.0"

[profile.release]
lto = "thin"
strip = "symbols"
